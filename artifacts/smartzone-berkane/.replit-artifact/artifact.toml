kind = "web"
previewPath = "/"
title = "SmartZone Berkane"
version = "1.0.0"
id = "artifacts/smartzone-berkane"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24722

[services.development]
run = "pnpm --filter @workspace/smartzone-berkane run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartzone-berkane", "run", "build" ]
serve = "static"
publicDir = "artifacts/smartzone-berkane/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24722"
BASE_PATH = "/"
